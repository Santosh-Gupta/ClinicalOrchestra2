[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-orchestra-two"
version = "0.0.1"
description = "A source-grounded benchmark for predicting documented clinical events."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Santosh Gupta" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clinical_orchestra.construction" = ["prompts/*.txt"]
